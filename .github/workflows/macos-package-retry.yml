name: Montar beta Mac com binários já testados
on:
  push:
    branches: [main]
    paths: ['.github/workflows/macos-package-retry.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que os fontes continuam iguais aos binários testados
        run: |
          git fetch --depth=1 origin 3208b40ff11ec9f3e4280b0fa46c1f2cf0578566
          git diff --exit-code FETCH_HEAD HEAD -- macos/Sources macos/Package.swift macos/Tests
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38605938581
          path: compiled
      - run: python3 tools/package-macos.py
      - name: Publicar pacote Mac verificado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("mac-release.json"))["version"])')
          TAG="mac-v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target 3208b40ff11ec9f3e4280b0fa46c1f2cf0578566 --title "LUA $VERSION Beta para macOS" --notes-file mac-notes.md --draft --prerelease
          gh release upload "$TAG" "LUA-$VERSION-macOS-universal.zip" LUA-macOS-atualizacoes.json LUA-macOS-previas.zip --clobber
          gh release edit "$TAG" --draft=false --prerelease --latest=false --notes-file mac-notes.md
